# Bootstrap site: install only until the certificate has been issued.
# Then replace this site with fridge.conf. No other nginx site needs changing.
server {
    listen 80;
    listen [::]:80;
    server_name fridge.georgeanagnostou.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/fridge/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://fridge.georgeanagnostou.com$request_uri;
    }
}
