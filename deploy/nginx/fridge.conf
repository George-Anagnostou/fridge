# nginx site for the fridge app. First install fridge-http.conf and issue this
# site's certificate with Certbot's webroot mode (docs/DEPLOY.md). Then install
# this file in its place. Certbot never edits nginx sites. This template
# includes TLS, so reinstalling it preserves HTTPS.
#
# The app listens on loopback only. nginx is the public HTTPS front.

server {
    listen 80;
    listen [::]:80;
    server_name fridge.georgeanagnostou.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/fridge/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://fridge.georgeanagnostou.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name fridge.georgeanagnostou.com;

    ssl_certificate /etc/letsencrypt/live/fridge.georgeanagnostou.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fridge.georgeanagnostou.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:fridge_ssl:1m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    charset utf-8;
    server_tokens off;

    # No includeSubDomains: other georgeanagnostou.com subdomains are hosted elsewhere.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Robots-Tag "noindex" always;

    location / {
        # The app binds 127.0.0.1:8082 (see /etc/fridge/fridge.env).
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # X-Real-IP is the TCP peer. The app trusts this header only when the
        # direct peer is loopback (TRUST_PROXY=1).
        #
        # If this site is later proxied through Cloudflare, $remote_addr will
        # be Cloudflare's edge, not the client. In that case, after restricting
        # real_ip_header / set_real_ip_from to Cloudflare IP ranges, set:
        #   proxy_set_header X-Real-IP $http_cf_connecting_ip;
        # Proxying is unconfirmed, so the TCP peer is used as-is.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
