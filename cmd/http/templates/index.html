<!DOCTYPE html>
<html lang="en">
<head>
    {{template "head"}}
    <title>Fridge Manager</title>
</head>
<body>
<div class="wrap">
    <header class="top">
        <a class="brand" href="/">Fridge</a>
        {{if .Email}}
        <div class="who">
            <span>{{.Email}}</span>
            {{if .IsAdmin}}<a href="/admin/invites">Invites</a>{{end}}
            <form action="/logout" method="POST">
                <input type="hidden" name="csrf_token" value="{{.CSRF}}">
                <button type="submit" class="btn-quiet">Log out</button>
            </form>
        </div>
        {{end}}
    </header>

    <h1>Your stores</h1>
    {{if .Error}}<p class="error">{{.Error}}</p>{{end}}

    <ul class="list">
    {{range .Stores}}
        <li>
            <a class="card" href="/stores/{{.ID}}">
                <p class="card-title">{{.Name}}</p>
                <p class="perm">{{.Permission}}</p>
            </a>
        </li>
    {{else}}
        <li class="empty">No stores yet. Create one below.</li>
    {{end}}
    </ul>

    <h2>Create a store</h2>
    <form class="stack" action="/stores" method="POST">
        <input type="hidden" name="csrf_token" value="{{.CSRF}}">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" autocomplete="off" required>
        <button type="submit">Create store</button>
    </form>
</div>
</body>
</html>
