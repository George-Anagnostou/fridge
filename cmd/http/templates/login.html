<!DOCTYPE html>
<html lang="en">
<head>
    {{template "head"}}
    <title>Log in — Fridge Manager</title>
</head>
<body>
<div class="wrap">
    <header class="top">
        <a class="brand" href="/login">Fridge</a>
    </header>
    <h1>Log in</h1>
    {{if .Error}}<p class="error">{{.Error}}</p>{{end}}
    <form class="stack" action="/login" method="POST">
        <input type="hidden" name="csrf_token" value="{{.CSRF}}">
        <input type="hidden" name="next" value="{{.Next}}">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" value="{{.Email}}" autocomplete="username" autocapitalize="off" required>
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
        <button type="submit">Log in</button>
    </form>
    <p class="muted">New accounts require an invite link.</p>
</div>
</body>
</html>
