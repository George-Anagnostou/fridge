<!DOCTYPE html>
<html lang="en">
<head>
    {{template "head"}}
    <title>Edit {{.Item.Name}} — Fridge Manager</title>
</head>
<body>
<div class="wrap">
    <header class="top">
        <a class="brand" href="/">Fridge</a>
        <div class="who">
            <a href="/stores/{{.Store.ID}}">{{.Store.Name}}</a>
        </div>
    </header>
    <p class="crumb"><a href="/stores/{{.Store.ID}}">Back to {{.Store.Name}}</a></p>
    <h1>Edit item</h1>
    {{if .Error}}<p class="error">{{.Error}}</p>{{end}}
    <form class="stack" action="/stores/{{.Store.ID}}/items/{{.Item.ID}}/edit" method="POST">
        <input type="hidden" name="csrf_token" value="{{.CSRF}}">
        <label for="name">Item name</label>
        <input type="text" id="name" name="name" value="{{.Item.Name}}" autocomplete="off" required>
        <div class="row">
            <div>
                <label for="quantity">Quantity</label>
                <input type="number" id="quantity" name="quantity" min="0" step="any" value="{{.Item.Quantity}}" inputmode="decimal" required>
            </div>
            <div>
                <label for="expiration">Expires</label>
                <input type="date" id="expiration" name="expiration" value="{{.Item.ExpirationDate}}" required>
            </div>
        </div>
        <details{{if or .Item.Barcode .Item.Brand .Item.ServingSize .Item.Calories .Item.ProteinG .Item.CarbsG .Item.FatG}} open{{end}}>
            <summary>Optional details</summary>
            <label for="barcode">Barcode</label>
            <input type="text" id="barcode" name="barcode" value="{{.Item.Barcode}}" inputmode="numeric" autocomplete="off">
            <label for="brand">Brand</label>
            <input type="text" id="brand" name="brand" value="{{.Item.Brand}}" autocomplete="off">
            <label for="serving_size">Serving size</label>
            <input type="text" id="serving_size" name="serving_size" value="{{.Item.ServingSize}}" autocomplete="off">
            <div class="row">
                <div>
                    <label for="calories">Calories</label>
                    <input type="number" id="calories" name="calories" min="0" step="any" value="{{.Item.Calories}}" inputmode="decimal">
                </div>
                <div>
                    <label for="protein_g">Protein (g)</label>
                    <input type="number" id="protein_g" name="protein_g" min="0" step="any" value="{{.Item.ProteinG}}" inputmode="decimal">
                </div>
            </div>
            <div class="row">
                <div>
                    <label for="carbs_g">Carbs (g)</label>
                    <input type="number" id="carbs_g" name="carbs_g" min="0" step="any" value="{{.Item.CarbsG}}" inputmode="decimal">
                </div>
                <div>
                    <label for="fat_g">Fat (g)</label>
                    <input type="number" id="fat_g" name="fat_g" min="0" step="any" value="{{.Item.FatG}}" inputmode="decimal">
                </div>
            </div>
        </details>
        <button type="submit">Save</button>
    </form>
</div>
</body>
</html>
