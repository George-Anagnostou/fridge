<!DOCTYPE html>
<html lang="en">
<head>
    {{template "head"}}
    <title>Sign up — Fridge Manager</title>
</head>
<body>
<div class="wrap">
    <header class="top">
        <a class="brand" href="/login">Fridge</a>
    </header>
    <h1>Create an account</h1>
    {{if .Error}}<p class="error">{{.Error}}</p>{{end}}
    <form class="stack" action="/signup" method="POST">
        <input type="hidden" name="csrf_token" value="{{.CSRF}}">
        <input type="hidden" name="token" value="{{.Token}}">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" value="{{.Email}}" autocomplete="username" autocapitalize="off" required>
        <label for="password">Password (at least 8 characters)</label>
        <input type="password" id="password" name="password" minlength="8" autocomplete="new-password" required>
        <button type="submit">Sign up</button>
    </form>
    <p><a href="/login">Already have an account? Log in</a></p>
</div>
</body>
</html>
